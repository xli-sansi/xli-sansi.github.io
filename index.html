<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="三思而行：科技新闻、市场观察、趋势机会、海外产业与人物观点。"><title>三思而行 · 每天多看懂一点</title><style>
*{box-sizing:border-box}body{margin:0;color:#1d1d1f;background:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}button,input,select{font:inherit}button{cursor:pointer}a{color:#0071e3;text-decoration:none}a:hover{text-decoration:underline}button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #79b6f2;outline-offset:4px}nav{position:sticky;top:0;z-index:5;background:#ffffffed;backdrop-filter:blur(18px);border-bottom:1px solid #e5e5e7}.nav{max-width:1160px;margin:auto;padding:17px 24px;display:flex;align-items:center;gap:28px}.brand{font-size:21px;font-weight:650;letter-spacing:2px;white-space:nowrap;margin-right:auto}.brand span{color:#0071e3}.tabs{display:flex;gap:23px;overflow-x:auto;scrollbar-width:none}.tabs button{border:0;background:none;color:#6e6e73;font-size:13px;padding:10px 0;white-space:nowrap}.tabs button[aria-selected=true]{color:#0071e3}main{max-width:1160px;margin:auto;padding:0 24px}header{padding:38px 0 23px}.eyebrow{font-size:12px;color:#86868b;letter-spacing:1px}h1{font-size:38px;letter-spacing:-1.5px;font-weight:650;margin:13px 0 10px}.intro{font-size:14px;line-height:1.8;color:#6e6e73;margin:0}.tools{display:flex;gap:12px;margin:8px 0 24px}input,select{border:1px solid #dddde1;background:white;border-radius:12px;padding:13px 15px;color:#555}input{flex:1;min-width:0}select{max-width:175px}.count{font-size:12px;color:#86868b;margin:0 0 16px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.card{background:white;border-radius:22px;padding:28px;display:flex;flex-direction:column;box-shadow:0 2px 6px #00000002}.serial{font-size:12px;color:#86868b;display:flex;justify-content:space-between;gap:14px}.kind{color:#6e6e73;font-size:11px}h2{font-size:22px;line-height:1.5;letter-spacing:-.5px;margin:15px 0 10px;font-weight:620}.card p{font-size:14px;color:#626267;line-height:1.95;margin:0 0 14px}.card details{font-size:14px;line-height:1.95;color:#626267;margin-bottom:22px}.card summary{color:#0071e3;font-size:13px;cursor:pointer;margin-bottom:10px}.source{margin-top:auto;border-top:1px solid #f0f0f2;padding-top:18px;display:flex;gap:15px;align-items:center;justify-content:space-between}.source a{font-size:12px}.save{border:0;border-radius:20px;background:#f5f5f7;padding:8px 12px;font-size:12px;color:#777}.date{font-size:11px!important;color:#999!important;margin:12px 0 0!important}.more{display:block;margin:8px 0;font-size:12px}.empty{background:white;border-radius:20px;padding:50px 24px;text-align:center;color:#888;grid-column:1/-1}.audit{background:white;border-radius:22px;padding:25px;grid-column:1/-1;overflow:auto}.audit h2{margin-top:0}table{border-collapse:collapse;width:100%;font-size:13px;line-height:1.7}td,th{text-align:left;border-bottom:1px solid #eee;padding:13px 10px;vertical-align:top}th{color:#777;font-weight:500}.audit p,.audit li{font-size:13px;line-height:1.9;color:#666}.audit li{margin:8px 0}.market-hero{grid-column:1/-1;background:linear-gradient(135deg,#fff 0%,#f7f9ff 100%);border:1px solid #eceff7}.market-hero h2{font-size:28px}.market-note{font-size:12px;color:#86868b;line-height:1.8;margin-top:8px}footer{border-top:1px solid #dddde1;margin-top:45px;padding:24px 0 35px;font-size:12px;color:#86868b;line-height:1.8}footer span{display:block}@media(max-width:760px){.nav{display:block;padding:14px 18px 0}.brand{font-size:20px;margin-bottom:5px}.tabs{gap:24px}.tabs button{font-size:13px;padding:12px 0}main{padding:0 17px}header{padding:28px 0 18px}h1{font-size:30px}.grid{grid-template-columns:1fr;gap:15px}.card{padding:23px}.tools{gap:8px}select{max-width:142px;font-size:12px}h2{font-size:21px}.source{align-items:flex-start}.source a{max-width:75%}table{min-width:530px}.market-hero h2{font-size:24px}}
</style></head><body><nav><div class="nav"><div class="brand">三思而行<span>.</span></div><div class="tabs" role="tablist" aria-label="阅读栏目"><button data-tab="news" role="tab" aria-selected="true">今日精选</button><button data-tab="market" role="tab" aria-selected="false">市场观察</button><button data-tab="trends" role="tab" aria-selected="false">趋势与机会</button><button data-tab="industry" role="tab" aria-selected="false">海外产业</button><button data-tab="views" role="tab" aria-selected="false">人物观点</button><button data-tab="archive" role="tab" aria-selected="false">历史</button><button data-tab="sources" role="tab" aria-selected="false">来源</button></div></div></nav><main><header><div class="eyebrow" id="editionDate"></div><h1 id="title"></h1><p class="intro" id="intro"></p></header><div class="tools" id="tools"><input id="search" placeholder="搜索关键词、公司或人物" aria-label="搜索卡片"><select id="archiveDate" aria-label="选择归档日期" hidden></select><select id="saved" aria-label="收藏筛选"><option value="all">全部内容</option><option value="saved">已收藏</option></select></div><div class="count" id="count" aria-live="polite"></div><div class="grid" id="grid"></div><footer><span>三思而行 · 科技、产业与市场观察</span><span id="footer"></span></footer></main><script>
let D={date:'2026-11-02',updatedAt:'2026-11-02T08:12:31+08:00',news:[],trends:[],industry:[],views:[],audit:{counts:{},sectionNotes:{},sources:[],excluded:[],researchPlan:[]}};
let M={date:'2026-11-02',updatedAt:'2026-11-02T16:40:00+08:00',title:'市场观察',summary:'市场数据加载中。',cards:[]};
const EDITIONS=new Map();let editionDates=[];
const labels={news:['今日精选','当日消息，关注事实与影响。'],market:['市场观察','关注A股与全球市场的关键结构、资金风格与历史对照；日期巧合只作线索，不当作因果。'],trends:['趋势与机会','从变化中寻找需求，把机会落实成可验证的问题。'],industry:['海外产业','理解产品、客户和上下游；中国对照不足时明确保留。'],views:['人物观点','关注重要科技与产业人物的近期公开观点。'],archive:['历史记录','按收录日期查阅本期四栏内容。'],sources:['资料来源','本次实际读取结果、使用限制与剔除记录。']};
let tab='news';let stored=[];try{stored=JSON.parse(localStorage.getItem('horizon-saved')||'[]')}catch{}const saved=new Set(Array.isArray(stored)?stored:[]);const $=s=>document.querySelector(s);const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const link=(url,label)=>/^https:\/\//.test(url||'')?'<a href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">'+esc(label)+' ↗</a>':esc(label);
function card(x,i,hero=false){return '<article class="card'+(hero?' market-hero':'')+'"><div class="serial"><span>'+String(i+1).padStart(2,'0')+'</span><span class="kind">'+esc(x.kind)+'</span></div><h2>'+esc(x.title)+'</h2><p>'+esc(x.body||'')+'</p>'+(x.detail?'<details><summary>展开阅读</summary><div>'+esc(x.detail)+'</div></details>':'')+'<div class="source">'+link(x.url,x.org||'来源')+(x.id?'<button class="save" data-save="'+esc(x.id)+'" aria-pressed="'+saved.has(x.id)+'">'+(saved.has(x.id)?'已收藏 ✓':'收藏 +')+'</button>':'')+'</div>'+(x.sources||[]).map(s=>'<span class="more">'+link(s.url,s.name)+'</span>').join('')+'<p class="date">'+esc(x.date||'')+'</p></article>'}
function render(){const E=tab==='archive'?(EDITIONS.get($('#archiveDate').value)||D):D;const label=labels[tab]||labels.news;$('#title').textContent=tab==='market'?(M.title||label[0]):label[0];$('#intro').textContent=(tab==='market'?(M.summary||label[1]):label[1])+(tab!=='market'&&E.audit?.sectionNotes?.[tab]?' '+E.audit.sectionNotes[tab]:'');const stamp=tab==='market'?M.updatedAt:E.updatedAt;$('#editionDate').textContent=(tab==='market'?M.date:E.date)+' · 更新于 '+new Date(stamp).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai'});$('#archiveDate').hidden=tab!=='archive';$('#tools').hidden=tab==='sources';$('#footer').textContent='每日简报 · 市场观察单独归档 · 历史按日期保留 · 收藏保存在当前设备';
if(tab==='market'){let q=$('#search').value.trim().toLowerCase();let data=(M.cards||[]).filter(x=>(!q||JSON.stringify(x).toLowerCase().includes(q))&&($('#saved').value!=='saved'||saved.has(x.id)));$('#count').textContent='本栏'+(M.cards||[]).length+'条 · 当前显示 '+data.length+' 条';$('#grid').innerHTML=data.length?data.map((x,i)=>card(x,i,i===0)).join('')+'<div class="market-note">'+esc(M.note||'市场观察不构成投资建议。')+'</div>':'<div class="empty">市场观察内容读取中或暂缺。</div>';bindSave();return;}
if(tab==='sources'){const a=D.audit||{};$('#count').textContent='来源检索记录与实际引用原文';$('#grid').innerHTML='<section class="audit"><h2>常规检索清单</h2><p>'+esc((a.researchPlan||[]).join(' · '))+'</p><h2>来源检索记录</h2><table><thead><tr><th>来源</th><th>本轮结果</th><th>使用方式</th></tr></thead><tbody>'+(a.sources||[]).map(s=>'<tr><td>'+link(s.url,s.name)+'</td><td>'+esc(s.status)+'</td><td>'+esc(s.note)+'</td></tr>').join('')+'</tbody></table><h2 style="margin-top:30px">未收录的内容</h2><ul>'+(a.excluded||[]).map(x=>'<li>'+esc(x.item)+'：'+esc(x.reason)+'</li>').join('')+'</ul></section>';return;}
let all=tab==='archive'?['news','trends','industry','views'].flatMap(k=>E[k]||[]):(D[tab]||[]);let q=$('#search').value.trim().toLowerCase();let data=all.filter(x=>(!q||JSON.stringify(x).toLowerCase().includes(q))&&($('#saved').value!=='saved'||saved.has(x.id))&&(tab!=='archive'||x.archiveDate===$('#archiveDate').value));$('#count').textContent=(tab==='archive'?'本期四栏共'+all.length+'条':'本栏'+all.length+'条')+' · 当前显示 '+data.length+' 条';$('#grid').innerHTML=data.length?data.map((x,i)=>card(x,i)).join(''):'<div class="empty">没有匹配的内容。</div>';bindSave();}
function bindSave(){document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>{saved.has(b.dataset.save)?saved.delete(b.dataset.save):saved.add(b.dataset.save);try{localStorage.setItem('horizon-saved',JSON.stringify([...saved]))}catch{}render()});}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;$('#search').value='';document.querySelectorAll('[data-tab]').forEach(n=>n.setAttribute('aria-selected',String(n===b)));render()});$('#search').oninput=render;$('#saved').onchange=render;$('#archiveDate').onchange=async()=>{const date=$('#archiveDate').value;if(!EDITIONS.has(date)){try{EDITIONS.set(date,await fetchEdition(date))}catch{$('#count').textContent='该日期内容读取失败，请稍后再试。';$('#grid').innerHTML='';return;}}render()};
async function fetchEdition(date){if(!/^\d{4}-\d{2}-\d{2}$/.test(date))throw Error('invalid date');const r=await fetch('data/editions/'+date+'.json',{cache:'no-store'});if(!r.ok)throw Error('load failed');const e=await r.json();if(e.date!==date||!['news','trends','industry','views'].every(k=>Array.isArray(e[k])))throw Error('invalid edition');return e;}
async function refresh(){try{const [er,mr]=await Promise.all([fetch('data/manifest.json',{cache:'no-store'}),fetch('data/markets/manifest.json',{cache:'no-store'})]);if(er.ok){const em=await er.json();editionDates=[...new Set((em.editions||[]).filter(x=>/^\d{4}-\d{2}-\d{2}$/.test(x)))].sort().reverse();D=await fetchEdition(em.latest);EDITIONS.set(D.date,D);$('#archiveDate').innerHTML=editionDates.map(x=>'<option value="'+x+'">'+x+'</option>').join('');}if(mr.ok){const mm=await mr.json();const r=await fetch('data/markets/'+mm.latest+'.json',{cache:'no-store'});if(r.ok)M=await r.json();}render();}catch{render();}}
render();refresh();
</script></body></html>
